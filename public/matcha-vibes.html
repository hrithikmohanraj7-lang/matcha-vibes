<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <style>
    :root { --black:#050505; --green:#84a98c; }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--black); }
    body { min-height:100svh; }
    .landing { position:relative; width:100%; height:100svh; overflow:hidden; background:radial-gradient(circle at 50% 45%,rgba(132,169,140,.08),transparent 34%),var(--black); }
    .landing::before { content:''; position:absolute; inset:0; z-index:1; pointer-events:none; opacity:.08; background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.24) 4px); mix-blend-mode:screen; }
    .landing::after { content:''; position:absolute; inset:0; z-index:2; pointer-events:none; background:radial-gradient(ellipse at center,transparent 42%,rgba(0,0,0,.5) 100%); }
    canvas { position:absolute; inset:0; z-index:0; display:block; width:100%; height:100%; }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none !important; transition:none !important; } }
  </style>
</head>
<body>
  <main class="landing" aria-label="">
    <canvas id="landing-canvas" aria-label=""></canvas>
  </main>
  <script>
    const canvas=document.getElementById('landing-canvas');
    const ctx=canvas.getContext('2d');
    const image=new Image();
    image.decoding='async';
    image.src='/sequence/ezgif-frame-001.jpg';
    function draw(){
      if(!image.naturalWidth)return;
      const ratio=Math.min(innerWidth/image.naturalWidth,innerHeight/image.naturalHeight);
      const width=image.naturalWidth*ratio;
      const height=image.naturalHeight*ratio;
      const dpr=Math.min(devicePixelRatio||1,2);
      canvas.width=innerWidth*dpr;
      canvas.height=innerHeight*dpr;
      canvas.style.width=innerWidth+'px';
      canvas.style.height=innerHeight+'px';
      ctx.setTransform(dpr,0,0,dpr,0,0);
      ctx.clearRect(0,0,innerWidth,innerHeight);
      ctx.drawImage(image,(innerWidth-width)/2,(innerHeight-height)/2,width,height);
    }
    image.onload=draw;
    addEventListener('resize',draw,{passive:true});
  </script>
</body>
</html>
